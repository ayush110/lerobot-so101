[project]
name = "lerobot-so101-workspace"
version = "0.1.0"
description = "SO-101 simulation, robot learning, data, and deployment monorepo"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
]
robotics = [
    "gymnasium>=1.0",
    "mujoco>=3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
]
ml = [
    "torch>=2.5",
]

[tool.uv.workspace]
members = ["packages/python/*", "simulation/mujoco"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
