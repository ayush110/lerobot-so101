schema_version: 1
robot_id: so101-follower
backend: replay
calibration_version: example-v1

# Host-specific serial paths belong in configs/local/, which is gitignored.
serial:
  port: null
  baud_rate: 1000000

control:
  rate_hz: 30
  action_mode: joint_position
  maximum_chunk_steps: 16
  command_timeout_ms: 250

safety:
  start_disarmed: true
  maximum_joint_velocity_rad_s: 0.5
  maximum_step_rad: 0.08
  reject_non_finite: true
  reject_stale_commands: true

cameras:
  wrist:
    device: null
    frame_id: wrist_camera
    width: 640
    height: 480
    fps: 30
